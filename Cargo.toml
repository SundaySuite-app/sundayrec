[workspace]
# Clean separation between the Tauri shell (`src-tauri`) and the pure,
# GUI-free domain core (`crates/sundayrec-core`). The core is unit-testable
# without a webview or a display, which is exactly where the recorder logic
# (ffmpeg argument hardening, error classification, silence state machine)
# belongs — see docs/MIGRATION-TAURI2.md, "Tverrgående standarder".
#
# `crates/camera-*` (C1b) er Caps kamera-crates for Windows (MIT), tatt inn
# låst til én commit — se UPSTREAM.md i hver. `crates/mf-util` er vår egen
# erstatning for Caps AGPL-lisensierte `cap-mediafoundation-utils`, skrevet fra
# Microsofts dokumentasjon. Alle fire er `#![cfg(windows)]`: tomme på Mac/Linux.
members = [
    "src-tauri",
    "crates/sundayrec-core",
    "crates/filmcraft-audio-dsp",
    "crates/camera-windows",
    "crates/camera-mediafoundation",
    "crates/camera-directshow",
    "crates/mf-util",
]
resolver = "2"

# filmcraft-audio-dsp (B0a): upstream's realtime-factor and long spectral tests
# are minutes slower in an unoptimised build, so this one package is optimised
# in dev/test profiles (mirrors upstream's root Cargo.toml).
[profile.dev.package.filmcraft-audio-dsp]
opt-level = 3

# sundayrec-core (B4b): the open round (Kaiser-sinc resampler, level meter, the sermon
# search) is the per-sample work of the 90-minute test; unoptimised it takes minutes.
[profile.dev.package.sundayrec-core]
opt-level = 2
