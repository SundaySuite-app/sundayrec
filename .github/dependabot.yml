# Managed dependency updates. Weekly; minor/patch grouped to limit PR noise.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns: ["*"]
    ignore:
      # dtolnay/rust-toolchain: toolchainen er bevisst pinnet til 1.98.0 i hele
      # suiten (universal-bygg-fella), og 1.100.0 fantes ikke engang som tag — se #193.
      - dependency-name: "dtolnay/rust-toolchain"
