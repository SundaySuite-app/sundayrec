# Build, sign, notarize, and publish SundayRec for macOS + Windows on a version
# tag. Mirrors the proven SundayEdit release flow.
#
# Cut a release:   npm version <patch|minor|major>   (bumps package.json)
#                  # bump src-tauri/tauri.conf.json "version" + Cargo.toml to match
#                  git tag vX.Y.Z && git push origin vX.Y.Z
#
# The tag push triggers this workflow, which builds on macOS (Apple Silicon) and
# Windows, signs + notarizes macOS, and creates a DRAFT GitHub Release with the
# installers. Review the draft, then publish it.
#
# ── STATUS ────────────────────────────────────────────────────────────────────
# Signing is wired and ACTIVATES the moment the documented secrets exist
# (docs/DISTRIBUTION.md). Until then the build still runs but produces UNSIGNED
# installers (tauri-action skips signing when the secrets are absent).
#
# The auto-updater IS wired: tauri.conf.json carries the `plugins.updater`
# block (pubkey + endpoints, `createUpdaterArtifacts: true`) and this workflow
# sets `uploadUpdaterJson: true` so `latest.json` ships with every release.
# The only missing pieces are the CI secrets TAURI_SIGNING_PRIVATE_KEY (+
# password) — until they exist the updater artifacts are unsigned and installed
# clients won't accept them. See docs/NEEDS-RICHARD.md item 4.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon (arm64) — native build so the fetched
          # ffmpeg sidecar matches. Intel/universal is a follow-up (needs both
          # ffmpeg arches + a universal target).
          #
          # macOS ships `whisper` (transcription) with the Metal GPU backend
          # (Cargo.toml's macOS target gives whisper-rs the `metal` feature) —
          # without it the installed app could neither download a model nor
          # transcribe (everything degraded to `feature_disabled`).
          # History: an earlier release hit a ggml i8mm-intrinsic compile error
          # (`vmmlaq_s32` vs "requires target feature 'i8mm'") on the M1 runner
          # and whisper was dropped. The crate builds cleanly on a local M1 Pro
          # (same arch as the runner), so it's re-enabled; if the runner's
          # toolchain still trips, drop `whisper` from this line only and fall
          # back to shipping whisper-cli as a sidecar (the Electron approach).
          # The leading `--` forwards the rest to cargo (tauri-action runs
          # `tauri build <args>`, and tauri-cli only passes args after `--` on).
          # `tray` ships the menubar/tray icon. It
          # builds on both runners and degrades gracefully (install failure only
          # logs a warning), so it's safe to ship.
          # `email` ships the SMTP alerter — pure-Rust `lettre`, no native
          # dep. THESE LISTS ARE EXPLICIT: flipping Cargo.toml's `default` alone
          # never reaches a release, so both platform lines carry `email` too.
          # (`streaming` left both lines in v0.14 — the feature is gone.)
          - platform: macos-latest
            args: "-- --no-default-features --features editor,tray,updater,whisper,email"
          # Windows adds `asio`: a low-latency, single-device multichannel audio
          # backend for pro interfaces (the dshow path splits them into stereo
          # pairs). It needs the Steinberg ASIO SDK + LLVM + MSVC at build time —
          # set up by the windows-only steps below (see docs/BUILD_ASIO.md). The
          # recorder falls back to WASAPI automatically when no ASIO driver exists.
          # `whisper` stays OFF here pending a RUNTIME verification on a real
          # Windows box (the MSVC *compile* is proven green on every push by
          # ci.yml's windows-check job, which checks default features incl.
          # whisper — enabling it here is an owner decision + rig test).
          - platform: windows-latest
            args: "-- --no-default-features --features editor,tray,asio,updater,email"

    runs-on: ${{ matrix.platform }}
    steps:
      # Everything below keys off `github.ref_name` as though it were a version
      # tag: `tagName`, `releaseName`, and the `-beta.` tests that drive both
      # `prerelease` and the Windows `--bundles nsis` switch. On a
      # `workflow_dispatch` from a BRANCH, `ref_name` is the branch ("main"),
      # and the run would happily create a draft release literally tagged
      # `main`, mark it a normal release, and upload a `latest.json` to it.
      # Nothing downstream would catch it: promote-release.mjs rejects the tag,
      # but only after somebody has been handed a junk release to wonder about.
      # Dispatch on a TAG still works — that is the documented way to re-run a
      # release without re-tagging.
      - name: Refuse to build a release from a non-tag ref
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          echo "::error::release.yml ran on ${{ github.ref_type }} '${{ github.ref_name }}'."
          echo "This workflow only makes sense on a version tag — every release field is"
          echo "derived from the tag name. Re-run it selecting a tag, or push a v* tag."
          exit 1

      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # ── Windows ASIO build prerequisites (see docs/BUILD_ASIO.md) ──────────
      # cpal's `asio` feature compiles C++ glue + bindgen against the Steinberg
      # ASIO SDK, so the Windows job needs the MSVC environment, libclang, and
      # the SDK. macOS skips all of this (no `asio` feature there).
      - name: Set up MSVC environment (Windows, for ASIO)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch ASIO SDK + set ASIO build env (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip"
          Invoke-WebRequest -Uri $url -OutFile asiosdk.zip
          # SHA-256 pin: a moved/altered download must not silently feed the
          # build. The SDK zip is a frozen 2019 artifact, so this hash never
          # changes — it must never be emptied back out to "unpinned".
          $expected = "bc425d9b98701af74b43639798566c48bc005af7328a2251cff722c1885076b2"
          $actual = (Get-FileHash asiosdk.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "asiosdk.zip SHA-256: $actual"
          if ($expected -eq "") {
            Write-Error "ASIO SDK SHA-256 pin is empty — refusing to build against an unverified download."
            exit 1
          }
          if ($actual -ne $expected) {
            Write-Error "ASIO SDK checksum mismatch (expected $expected) — refusing to build."
            exit 1
          }
          Expand-Archive -Path asiosdk.zip -DestinationPath asiosdk -Force
          $sdk = (Get-ChildItem asiosdk -Directory | Select-Object -First 1).FullName
          echo "CPAL_ASIO_DIR=$sdk" >> $env:GITHUB_ENV
          # libclang ships with the LLVM that is preinstalled on the windows-latest
          # image; bindgen (used by asio-sys) needs LIBCLANG_PATH to find it.
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          Write-Host "ASIO SDK at $sdk"

      - name: Cache cargo (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch bundled ffmpeg/ffprobe sidecars
        run: node scripts/fetch-ffmpeg.mjs

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — REQUIRED for auto-update. Signs latest.json + the
          # per-platform artifacts with the keypair from
          # `npm run tauri signer generate` (pubkey is in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code-signing + notarization. Reuses the existing Electron-era
          # secrets (Developer ID, team 784GN847G4) under tauri-action's names,
          # so nothing has to be re-entered. MAC_CERTS = base64 .p12,
          # APPLE_APP_SPECIFIC_PASSWORD = the notarization app password.
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERTS }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Richard Fossland (784GN847G4)"
          # Notarization DISABLED 2026-07-31 (owner decision): Apple's notary
          # service returns 403 "A required agreement is missing or has expired"
          # until the updated Program License Agreement is accepted on
          # developer.apple.com (team 784GN847G4). The app is still Developer
          # ID-SIGNED (offline, works) — first launch needs right-click ▸ Open.
          # Re-enable by uncommenting these three lines once the agreement is
          # signed:
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Opt-in telemetry (Etappe 4). `src-tauri/src/telemetry/config.rs`
          # reads BOTH through `option_env!`, i.e. at COMPILE time — so they
          # have to be in the build step's env, not the runtime's. A build
          # missing either one gets no sender at all: a URL without a key would
          # POST and collect a 401 six times per payload.
          #
          # The write key is NOT a secret in the threat-model sense — it ships
          # inside every binary and is a spam filter, nothing more. Everything
          # that matters is enforced server-side by the Worker's validator,
          # which trusts no caller. It lives in Actions secrets so it stays out
          # of a public repo's history, not because leaking it breaks anything.
          # The ADMIN key is a real secret and must never appear here.
          #
          # Nothing is sent regardless until the operator grants consent
          # (default off) — see PRIVACY.md.
          SUNDAYREC_TELEMETRY_URL: https://telemetry.sundaysuite.app
          SUNDAYREC_TELEMETRY_KEY: ${{ secrets.SUNDAYREC_TELEMETRY_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SundayRec ${{ github.ref_name }}"
          releaseBody: |
            SundayRec — recording for church services (Tauri 2 rebuild).

            See the assets below to download and install. If a build is
            unsigned (pre-signing), on first launch:
            - macOS: right-click the app ▸ Open ▸ Open.
            - Windows: "More info" ▸ "Run anyway".
          releaseDraft: true
          # A `-beta.N` tag ships as a GitHub pre-release; a plain `vX.Y.Z` tag
          # ships as a normal release. Either way it lands as a DRAFT first —
          # nobody is served anything until the draft is reviewed and published.
          #
          # ── HISTORY: this used to be hardcoded `false`, and changing it used
          #    to be dangerous. It no longer is — here's why, so the next person
          #    to touch this line doesn't have to rediscover it. ─────────────
          # Until Etappe 7, SundayRec's auto-updater read GitHub's
          # `/releases/latest/download/latest.json` directly. That endpoint
          # EXCLUDES pre-releases by definition, so marking a release
          # `prerelease: true` meant it could never become "latest" — every
          # installed client would silently stop seeing updates (`latest.json`
          # 404, forever, with nothing in the UI to say why). That was real, and
          # it is why this value used to be hardcoded `false` with a comment
          # warning never to change it.
          #
          # Since Etappe 7 the updater no longer reads `/releases/latest` at
          # all: installed clients ask the Sunday Suite update feed
          # (`https://updates.sundaysuite.app/v1/update/{stable|beta}` — a
          # different host from the telemetry admin API on purpose, see
          # PRIVACY.md), which serves only a tag that an owner has EXPLICITLY
          # promoted with `node scripts/promote-release.mjs <channel> <tag>`
          # (docs/RELEASE-CHECKLIST.md). GitHub's own notion of "latest" is now
          # irrelevant to the update feed — it only matters to a human browsing
          # github.com/…/releases. So `prerelease` can safely track what it
          # actually means (does this tag carry a `-beta.` suffix) instead of
          # being pinned to `false` to dodge a trap that no longer exists. This
          # IS the reason the Worker-served feed was adopted in the first
          # place: decoupling "what GitHub calls latest" from "what the
          # updater offers" removes this footgun instead of just working
          # around it.
          #
          # (Transition note: builds up to and including v0.10.0 still have the
          # OLD GitHub endpoint compiled in and never consult this feed at all
          # — see docs/ROLLBACK.md for what that means for the kill-switch.)
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          # Uploads latest.json (the updater feed) alongside the installers.
          #
          # The input is `uploadUpdaterJson`. It was `includeUpdaterJson` here
          # until v0.11.0-beta.1, which is not a real tauri-action input — the
          # run logged `Unexpected input(s) 'includeUpdaterJson'` and ignored it.
          # The feed shipped anyway, on a default we did not know we depended on,
          # which is exactly the arrangement that stops updates silently the day
          # a default changes.
          uploadUpdaterJson: true
          # `--bundles nsis` on Windows BETA builds only.
          #
          # MSI cannot express a beta version. Windows Installer's ProductVersion
          # is three numeric fields, so tauri refuses the bundle outright:
          #   "optional pre-release identifier in app version must be
          #    numeric-only and cannot be greater than 65535 for msi target"
          # `-beta.1` has letters in it, so every Windows beta build failed at
          # the bundling step while macOS sailed through — which is how
          # v0.11.0-beta.1's first run produced a draft with only mac assets.
          #
          # Renaming betas to something numeric (`0.11.0-1`) would satisfy MSI
          # and break everything else: the tag would no longer match `-beta.`,
          # so `prerelease:` above would go false and `promote-release.mjs` would
          # refuse the tag. Dropping MSI from betas costs nothing by comparison —
          # NSIS is what the updater installs from anyway. Stable releases are
          # untouched and still ship both.
          args: ${{ (matrix.platform == 'windows-latest' && contains(github.ref_name, '-beta.')) && '--bundles nsis ' || '' }}${{ matrix.args }}
