name: CI

on:
  # The repo is public, so Actions minutes are free — run the full gate on
  # every push to main and every PR (it used to be tag-only to save minutes
  # while the account's billing was blocked), plus on v* tags alongside
  # release.yml and via manual dispatch.
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Pinned: a floating stable + `-D warnings` turns any newly-added clippy lint into a red main. Bump deliberately.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri needs the system webview + GTK libs to compile on Linux; cpal
      # needs ALSA dev headers (libasound2-dev) for the VU metering engine.
      # ffmpeg itself ships as a sidecar binary (fetched below), not a system
      # dependency.
      - name: Install Tauri + audio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libasound2-dev

      - run: npm ci

      # Populate src-tauri/binaries/ffmpeg-<triple> + ffprobe so the media
      # health-check + recorder integration tests resolve a real binary instead
      # of taking their tolerant skip path.
      - name: Fetch ffmpeg/ffprobe sidecars
        run: npm run ffmpeg

      - name: Frontend lint / format / types
        run: |
          npm run lint
          npm run format:check
          npm run typecheck

      # The shell must build, AND the bundle must contain no dynamic code
      # evaluation — the shipped CSP is `script-src 'self'`, so a transform that
      # reached for it would produce a bundle that builds fine and is a blank
      # window in WKWebView. This is the standing version of the S0 spike's
      # proof; e2e/boot.spec.ts is the runtime half.
      #
      # `dist/` is the artifact a release is cut from (tauri.conf.json's
      # `frontendDist`), so since fase B this greps the bundle that actually
      # ships rather than a parallel `dist-app/`.
      - name: The shell builds under the shipped CSP
        run: |
          npm run build
          if grep -rqE 'eval\(|new[[:space:]]+Function' dist; then
            echo "::error::dist contains dynamic code evaluation — the shipped CSP (script-src 'self') would block it. See docs/APP-SHELL.md."
            grep -rnE 'eval\(|new[[:space:]]+Function' dist | head -20
            exit 1
          fi

      # Vitest: pure renderer logic (editor cut-plan/geometry, locale parity).
      - name: Frontend unit tests
        run: npm run test

      # package.json / Cargo.toml / tauri.conf.json must agree on the version.
      - name: App version in sync
        run: npm run version-sync

      # Peker hvert `t/tf/tn/tArr/tDyn`-kall i `app/` på en nøkkel som FINNES,
      # i den formen kallet forutsetter, i BÅDE no.json og en.json? Alle fire
      # feilformene (streng lest som gruppe, gruppe lest som streng, array som
      # streng, tomt tDyn-subtre) er ellers HELT stille.
      #
      # …og motsatt vei: finnes det nøkler ingen leser? Den halvdelen var
      # informativ mens legacy-skallet eide mesteparten av katalogen. Fase B
      # slettet skallet, `--unused` ble en FEILENDE gate, og 653 nøkler ble
      # ryddet ut av alle sju katalogene. «Leser» er BÅDE et `t()`-kall i
      # SKALLET og en nøkkel navngitt av en delt kjerne under `app/lib/` — de
      # rene modulene svarer med nøkler, og en prune som bare talte kallene
      # ville slettet tekst som faktisk rendres.
      #
      # De to gamle HTML-gatene (`check-i18n-fallbacks`, `check-i18n-hardcoded`)
      # er borte: begge målte `legacy/renderer/index.html`, som ikke finnes.
      - name: i18n keys exist, and nothing dead is left behind
        run: |
          npm run i18n-keys
          npm run i18n-keys:unused

      # i18n-hardkodingsgate for `app/`, baseline 0 fra dag én: skallet har
      # ingen gjeld å betale ned, hver streng skrives nå. Den ser prosa i
      # JSX-tekst, i JSX-attributter OG i objekt-egenskaper (dialogtekstene er
      # egenskaper, ikke attributter — en gate som bare så JSX ville bommet på
      # hver streng en frivillig leser når det gjelder), og forbyr `data-i18n`,
      # som er legacy-skallets mekanisme og stille feil i et reaktivt tre.
      # Selvtest innebygd som mutasjonsvern.
      - name: i18n hardcoded-text gate (app/)
        run: npm run i18n-hardcoded-tsx

      # i18n-flertallsgate: hver `tn()`-nøkkel må være en CLDR-flertallsgruppe,
      # hver gruppe må ha nøyaktig kategoriene språket trenger (regnet ut med
      # Intl.PluralRules, ikke listet for hånd), og ingen gruppe må leses med
      # `t()`. En manglende `few` i pl.json er ellers helt stille: teksten er
      # bare gal for 2–4 og 22–24. Selvtest innebygd som mutasjonsvern. I
      # `npm run check` og ci-local.sh også — gate-paritet er lov.
      - name: i18n plural groups complete in every locale
        run: npm run i18n-plurals

      # Fargegate for `app/`: en farge finnes ÉN gang, i app/styles/tokens.css,
      # og hver komponent-CSS bruker `var(--…)`. Legacy-skallet har en pen
      # `:root`-blokk og over tusen hardkodede farger under den — resultatet er
      # en app eieren ikke kan fargejustere ett sted. Ett funn feller gaten, fra
      # dag én. Selvtest innebygd som mutasjonsvern. I `npm run check` og
      # ci-local.sh også — gate-paritet er lov.
      - name: app colours only via tokens
        run: npm run css-tokens

      # docs/SMOKE-TEST.md's VERIFIED-BY pointers must resolve to tests that
      # still exist — a pointer at nothing claims coverage that does not exist.
      # In `npm run check` since E11; mirrored here so a PR can't skip it.
      - name: Smoke-runbook VERIFIED-BY pointers resolve
        run: npm run smoke-verified

      # The Rust suite is deliberately device-INDEPENDENT (device enumeration
      # tolerates zero devices; the cpal/ffmpeg streams are not opened in tests;
      # the keychain test skips when no keychain is reachable) so it passes on a
      # headless runner. Hardware capture/preview is validated manually — see
      # docs/MIGRATION-TAURI2.md, Phase 0/3 hardware matrix.
      - name: Rust fmt / clippy / tests
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # The ts-rs bindings are generated from the Rust types into the transient
      # src/lib/bindings/ and synced to the COMMITTED legacy/bindings/ (which
      # the renderer's legacy/types re-export). Regenerate and fail if the
      # committed copy drifted, so the frontend contract can never silently
      # diverge from the backend.
      - name: ts-rs bindings are up to date
        run: |
          npm run bindings
          # status --porcelain (not diff): also catches brand-new binding files,
          # which are untracked and invisible to `git diff`.
          if [ -n "$(git status --porcelain -- legacy/bindings)" ]; then
            echo "::error::ts-rs bindings are stale — run 'npm run bindings' and commit the result."
            git status --porcelain -- legacy/bindings
            git --no-pager diff -- legacy/bindings
            exit 1
          fi

      # Regression gate for docs/COMMAND_AUDIT_2026-08.md: fails if a command
      # that was reachable from the renderer goes dark, or a newly-registered
      # command sits unreachable without anyone classifying it as intentional.
      # See scripts/check-command-reachability.mjs for the method.
      - name: Command reachability regression check
        run: npm run reachability

      # The feature-off degradation path (every editor/tray/updater
      # command returns feature_disabled) must keep COMPILING — it once broke
      # silently ("Permission updater:default not found") because nothing
      # gated it. Clippy (not just check) with -D warnings: `cargo check` let
      # four dead-code findings live on main for weeks, because dead_code only
      # fires in the lane where the item's callers are compiled out. Cheap with
      # the shared cache.
      - name: cargo clippy (feature-off build)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  # E9's neural VAD is DEFAULT-OFF, so every step in `check` compiles the seam
  # OUT. Its value is a set of tests that catch failure modes the model has
  # no error for — a 512-sample window instead of 576, `sr` at 8000, inputs
  # bound by index, a lost symbolic batch dim — and a test that never runs
  # protects nothing. This is the job where they run. It also keeps the
  # feature-ON side under `-D warnings`: the default gate can never see it,
  # which is exactly how a stub and its real implementation drift apart.
  #
  # Its own JOB (split out of `check` 2026-08-09) purely for wall time: the
  # vad lane took ~4½ min at the END of a ~21 min serial job while every other
  # job in the pipeline had been idle for 15. Same two commands, same flags —
  # only the job boundary moved. It pays its own ~2 min setup (apt + npm) to
  # keep the environment byte-identical with the old in-job step, and carries
  # its own Swatinem cache key (rust-cache keys by job id).
  vad:
    name: Rust clippy + tests (vad feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri + audio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libasound2-dev

      - run: npm ci

      # Same real sidecars as `check` (not the Windows job's stubs), so any
      # vad-adjacent test that resolves a binary behaves exactly as before.
      - name: Fetch ffmpeg/ffprobe sidecars
        run: npm run ffmpeg

      - name: Rust clippy + tests (vad feature)
        working-directory: src-tauri
        run: |
          cargo clippy --workspace --all-targets --features vad -- -D warnings
          cargo test --workspace --features vad vad::

  # Compile the frontend + the Rust app on Linux (fast smoke; the real
  # macOS/Windows bundles are built in release.yml). --no-bundle skips
  # installer packaging.
  #
  # Its own JOB (split out of `check` 2026-08-09) for the same wall-time
  # reason as `vad`: this release-profile build shares no artifacts with the
  # debug-profile clippy/test steps anyway, and as the last step of a serial
  # job it alone held the pipeline ~7 min past every other job's finish.
  # Identical command; own cache key means the release artifacts stop
  # competing with the debug artifacts for the shared cache's 2 GB budget.
  build-smoke:
    name: Build Tauri app (no bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri + audio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libasound2-dev

      - run: npm ci

      - name: Fetch ffmpeg/ffprobe sidecars
        run: npm run ffmpeg

      - name: Build Tauri app (no bundle)
        run: npm run tauri build -- --no-bundle

  # The Playwright tier — the E5 gate that never actually landed in CI. The
  # tier existed and caught real seam bugs (the onboarding spec vs. the #100
  # privacy-copy change), but only when somebody remembered to run it, and
  # main sat red for days with nobody told. It runs the renderer in a plain
  # browser through the api-shim fixture seam: no Rust build, no tauri, no
  # system webview — just node, chromium and the Vite dev server that
  # playwright.config.ts starts itself. `predev` fetches the ffmpeg sidecars
  # it insists on, hence no sidecar step here.
  e2e:
    name: Playwright e2e (renderer harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run the e2e tier
        run: npm run e2e

      # Traces are the whole point of a failed e2e run: without them a red
      # spec on CI is a rumour. Uploaded only on failure to keep artifacts
      # lean.
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # Windows compile check — closes the "ubuntu-only CI" blind spot: the
  # recorder's Windows halves (windows-sys job objects, cpal WASAPI paths,
  # dshow arg builders, seek_write in the WAV writer) only COMPILE on a
  # Windows target, and a PR with a merge conflict once shipped a Windows
  # build break that ubuntu could never have caught. cargo check + clippy
  # only (no tests, no bundle — release.yml builds the real installer), so
  # the job stays fast. The repo is public → Actions minutes are free.
  windows-check:
    name: Windows cargo check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build verifies every `externalBin` resource EXISTS even for a
      # plain `cargo check` — empty stubs satisfy it without downloading the
      # ~80 MB real sidecars this job never executes (release.yml fetches the
      # real, checksum-pinned ones).
      - name: Stub ffmpeg sidecars for tauri-build's existence check
        working-directory: src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force binaries | Out-Null
          New-Item -ItemType File -Force binaries/ffmpeg-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force binaries/ffprobe-x86_64-pc-windows-msvc.exe | Out-Null

      - name: cargo check + clippy (workspace, all targets)
        working-directory: src-tauri
        run: |
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings

      # Approximate the Windows RELEASE feature combo (release.yml builds
      # --no-default-features --features editor,tray,asio,updater,email;
      # asio needs the Steinberg SDK so it is left out here) — a feature-gate seam
      # that only breaks off-default used to surface at tag time. This line TRACKS
      # the release list: adding a feature there means adding it here.
      #
      # ⚠️ COVERAGE GAP, left open on purpose: because `asio` is missing here, the
      # exact feature combo release.yml actually SHIPS for Windows is never
      # compiled in PR CI — only this asio-less approximation is. A PR that only
      # breaks under `--features asio` (Steinberg SDK not available in this
      # runner) will show green here and still fail at tag time in release.yml.
      # Don't assume this step proves the Windows release build compiles.
      - name: cargo check (Windows release feature combo, minus asio)
        working-directory: src-tauri
        run: cargo check --workspace --no-default-features --features editor,tray,updater,email

  # Dependency vulnerability scan — advisory DBs for both ecosystems. Runs as
  # its own job so a slow cargo-audit install doesn't hold up the main gate.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.98.0

      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
