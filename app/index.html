<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <!--
      The CSP must be BYTE-IDENTICAL to app.security.csp in
      src-tauri/tauri.conf.json — app/security-sync.test.ts fails CI if the
      two drift. Keeping it here (rather than trusting the Tauri header alone)
      is what makes a plain `npm run dev` browser boot enforce the SAME policy
      the shipped WKWebView does, which is the whole point of the S0 spike:
      script-src 'self' alone, with no dynamic code evaluation and no remote
      script. This is the only index.html in the repo since fase B; the test's
      covers-every-shell assertion stays so a SECOND one cannot arrive with no
      policy check at all, which looks exactly like green.

      (The two forbidden constructs are deliberately not spelled out here: the
      spike's proof is a grep of the BUILT bundle for them, and a comment that
      names them would answer that grep with itself.)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: asset: http://asset.localhost https://asset.localhost; media-src 'self' blob: asset: http://asset.localhost https://asset.localhost; connect-src 'self' ipc: http://ipc.localhost"
    />
    <title>SundayRec</title>
    <!--
      Fanikonet. `app/public/` er Vites statiske rot (`root: "app"` i
      vite.config.ts), så `/icon.svg` serveres både av `npm run dev` og fra
      `dist/`. Fila er en kopi av `src-tauri/app-icon.svg` — samme tegning som
      `app/ui/AppLogo/AppLogo.tsx`, men med sine egne generiske `id`-er, og
      derfor trygg som eget dokument.

      Uten den ba WKWebView om `/favicon.ico`, fikk index.html tilbake, og
      viste standardikonet — ikke synlig i det utsendte vinduet, men det ER det
      man ser i en nettleserfane under `npm run dev` og i hvert skjermbildepass.
    -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <!--
      Dialogen og toastene bor HER, som søsken av #app og ikke inni det.
      DialogHost setter `inert` på #app mens en dialog står åpen — det er sånn
      resten av appen blir helt utilgjengelig, ikke bare grå — og en dialog som
      lå inne i #app ville slått av seg selv. To monteringspunkter, to Preact-
      trær, i main.tsx.
    -->
    <div id="overlays"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
