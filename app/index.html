<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <!--
      The CSP must be BYTE-IDENTICAL to app.security.csp in
      src-tauri/tauri.conf.json — legacy/security-sync.test.ts fails CI if the
      two drift, and it covers this file as well as the legacy one. Keeping it
      here (rather than trusting the Tauri header alone) is what makes a plain
      `vite --mode app` browser boot enforce the SAME policy the shipped
      WKWebView does, which is the whole point of the S0 spike: script-src
      'self' alone, with no dynamic code evaluation and no remote script.

      (The two forbidden constructs are deliberately not spelled out here: the
      spike's proof is a grep of the BUILT bundle for them, and a comment that
      names them would answer that grep with itself.)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: asset: http://asset.localhost https://asset.localhost; media-src 'self' blob: asset: http://asset.localhost https://asset.localhost; connect-src 'self' ipc: http://ipc.localhost"
    />
    <title>SundayRec</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
